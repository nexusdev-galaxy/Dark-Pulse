<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dark Pulses</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid #222;
      position: fixed;
      width: 100%;
      background: #000;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(45deg, red, darkred);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #fff;
      font-size: 14px;
      letter-spacing: 2px;
    }

    nav a:hover {
      color: red;
    }

    .cart {
      border: 1px solid #333;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
    }

    main {
      padding-top: 120px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 80px;
      align-items: center;
    }

    .hero h2 {
      font-size: 60px;
      font-weight: 900;
    }

    .hero span {
      color: red;
    }

    .btn {
      background: red;
      color: #000;
      border: none;
      padding: 15px 30px;
      margin-top: 20px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }

    .products {
      padding: 80px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
    }

    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }

    .price {
      color: red;
      font-weight: bold;
      margin: 10px 0;
    }

    footer {
      border-top: 1px solid #222;
      text-align: center;
      padding: 40px;
      color: #555;
    }

    @media(max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">DARK PULSES</div>
  <nav>
    <a href="#">HOME</a>
    <a href="#">SHOP</a>
    <a href="#">DROP</a>
    <a href="#">CONTATO</a>
  </nav>
  <div class="cart">🛒 0</div>
</header>

<main>

  <section class="hero">
    <div>
      <h2>VISTA A <br><span>ESCURIDÃO</span></h2>
      <p style="margin-top:20px;color:#888;">
        Streetwear premium com estética dark.
      </p>
      <button class="btn">COMPRAR AGORA ⚡</button>
    </div>
    <div style="font-size:120px;text-align:center;">🖤</div>
  </section>

  <section class="products">
    <h2 style="margin-bottom:40px;">🔥 DROP DA SEMANA</h2>

    <div class="grid">
      <div class="card">
        <h3>SHADOW TEETH</h3>
        <div class="price">R$ 189</div>
        <button class="btn">COMPRAR</button>
      </div>

      <div class="card">
        <h3>MIDNIGHT HOOD</h3>
        <div class="price">R$ 349</div>
        <button class="btn">COMPRAR</button>
      </div>

      <div class="card">
        <h3>CARGO PULSE</h3>
        <div class="price">R$ 299</div>
        <button class="btn">COMPRAR</button>
      </div>
    </div>
  </section>

</main>

<footer>
  © 2026 DARK PULSES. TODOS OS DIREITOS RESERVADOS.
</footer>

</body>
</html>
